<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Joruri-Seba</title>
    <link
      rel="shortcut icon"
      href="./assets/logo-dark.png"
      type="image/x-icon"
    />
    <!-- daisyui cdn & tailwind cdn -->
    <link
      href="https://cdn.jsdelivr.net/npm/daisyui@5"
      rel="stylesheet"
      type="text/css"
    />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>

  <body>
    <nav class="flex justify-between my-6 max-w-[1800px] mx-auto">
      <div>
        <img src="./assets/Logo.png" alt="">
      </div>
      
      <div class=" flex gap-4">
        <p class="flex justify-center items-center bg-lime-100 w-20 h-10 p-2 gap-2 rounded-full font-bold"><span id="heart-count">0</span>❤️</p>
        <p class="flex justify-center items-center bg-lime-100 w-20 h-10 p-2 gap-2 rounded-full font-bold"><span id="coins-count">100</span>🪙</p>
        <p class="flex justify-center items-center bg-green-600 w-24 h-10 p-2 gap-2 rounded-full text-white"><span id="copy-count">0</span>Copy</p>
      </div>
    </nav>

    <main class="bg-gradient-to-r from-[#013223] via-[#006747] to-[#013223] flex flex-col justify-center items-center text-center gap-4 py-8">
      <div>
        <img class="w-28 h-28" src="./assets/logo-dark.png" alt="">
      </div>
      <div class="text-white">
        <h1 class="font-bold text-2xl">Emergency Service Directory</h1>
        <p>Government Emergency Services at Your Fingertip – A Project by  Government of the People’s Republic of Bangladesh</p>
      </div>
    </main>
  </body>
  <script src="./index.js"></script>
</html>
